name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: [self-hosted, brigade]
    container: ubuntu:24.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates build-essential
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: vet
        run: go vet ./...
        working-directory: backend
      - name: test
        run: go test -race ./...
        working-directory: backend

  web:
    runs-on: [self-hosted, brigade]
    container: ubuntu:24.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        run: |
          npm ci
          npm run build
        working-directory: web

  push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, web]
    runs-on: [self-hosted, brigade]
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_HOST: unix://${{ vars.DOCKER_SOCKET }}
    container:
      image: ubuntu:24.04
      volumes:
        - ${{ vars.DOCKER_SOCKET }}:${{ vars.DOCKER_SOCKET }}
    strategy:
      matrix:
        include:
          - image: brigade
            context: .
            dockerfile: Dockerfile
          - image: brigade-agent
            context: .
            dockerfile: docker/claude-agent/Dockerfile
    steps:
      - name: install docker cli
        run: apt-get update && apt-get install -y --no-install-recommends docker.io ca-certificates
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  release:
    needs: push
    runs-on: [self-hosted, brigade]
    permissions:
      contents: write
    container: ubuntu:24.04
    steps:
      - name: install tools
        run: apt-get update && apt-get install -y --no-install-recommends gh make ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        run: make build
      - name: package
        run: |
          tar -czf "brigade-${{ github.ref_name }}-linux-amd64.tar.gz" -C backend/bin brigade
          cp "brigade-${{ github.ref_name }}-linux-amd64.tar.gz" brigade-linux-amd64.tar.gz
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            set -- --prerelease
          else
            set --
          fi
          gh release create "$TAG" \
            "brigade-$TAG-linux-amd64.tar.gz" \
            brigade-linux-amd64.tar.gz \
            --generate-notes \
            --verify-tag \
            "$@"
