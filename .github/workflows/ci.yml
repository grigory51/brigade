name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, brigade]
    container: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: vet
        run: go vet ./...
        working-directory: backend
      - name: test
        run: go test -race ./...
        working-directory: backend

  web:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, brigade]
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        run: |
          npm ci
          npm run build
        working-directory: web

  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: wait for main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 180); do
            result=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch main \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$result" in
              "completed success") exit 0 ;;
              "completed "*) echo "main CI failed: $result"; exit 1 ;;
            esac
            sleep 10
          done
          echo "main CI did not complete within 30 minutes"
          exit 1

  push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: [self-hosted, brigade]
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_HOST: unix://${{ vars.DOCKER_SOCKET }}
    container:
      image: ubuntu:24.04
      volumes:
        - ${{ vars.DOCKER_SOCKET }}:${{ vars.DOCKER_SOCKET }}
    strategy:
      matrix:
        include:
          - image: brigade
            context: .
            dockerfile: Dockerfile
          - image: brigade-agent
            context: .
            dockerfile: docker/agent/Dockerfile
    steps:
      - name: install docker cli
        run: apt-get update && apt-get install -y --no-install-recommends docker.io ca-certificates
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  release:
    needs: push
    runs-on: [self-hosted, brigade]
    permissions:
      contents: write
    container: ubuntu:24.04
    steps:
      - name: install tools
        run: apt-get update && apt-get install -y --no-install-recommends gh make ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        run: make build
      - name: package
        run: |
          tar -czf "brigade-${{ github.ref_name }}-linux-amd64.tar.gz" -C backend/bin brigade
          cp "brigade-${{ github.ref_name }}-linux-amd64.tar.gz" brigade-linux-amd64.tar.gz
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            set -- --prerelease
          else
            set --
          fi
          gh release create "$TAG" \
            "brigade-$TAG-linux-amd64.tar.gz" \
            brigade-linux-amd64.tar.gz \
            --generate-notes \
            --verify-tag \
            "$@"
