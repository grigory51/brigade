name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  backend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: vet
        run: go vet ./...
        working-directory: backend
      - name: test
        run: go test -race ./...
        working-directory: backend

  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        run: |
          npm ci
          npm run build
        working-directory: web

  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: wait for main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 180); do
            result=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch main \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$result" in
              "completed success") exit 0 ;;
              "completed "*) echo "main CI failed: $result"; exit 1 ;;
            esac
            sleep 10
          done
          echo "main CI did not complete within 30 minutes"
          exit 1

  push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: brigade
            context: .
            dockerfile: Dockerfile
            description: Brigade server and web UI for running coding agents in local or Docker sessions
          - image: brigade-agent
            context: .
            dockerfile: packaging/docker/agent/Dockerfile
            description: Brigade agent runtime with Claude Code, Codex, ACP adapters, and built-in MCP tools
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.description=${{ matrix.description }}
            index:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/releases
          build-args: |
            VERSION=${{ github.ref_name }}

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build application
        run: make app
      - name: package DMG
        run: scripts/make-dmg.sh dist/Brigade.app "dist/Brigade-${GITHUB_REF_NAME}-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: brigade-macos
          path: dist/*.dmg
          if-no-files-found: error

  cad-plugin:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/cad/ui/package-lock.json
      - name: install uv
        run: python -m pip install uv
      - name: build CAD plugin
        run: |
          plugins/cad/build.sh
          mv plugins/cad/brigade-cad.mcpb "brigade-cad-${{ matrix.platform }}.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: brigade-cad-${{ matrix.platform }}
          path: brigade-cad-${{ matrix.platform }}.mcpb
          if-no-files-found: error

  release:
    needs: [push, desktop, cad-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: brigade-macos
          path: desktop-artifact
      - uses: actions/download-artifact@v4
        with:
          pattern: brigade-cad-*
          path: plugin-artifacts
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: extract binary from image
        run: |
          IMAGE="ghcr.io/$GITHUB_REPOSITORY_OWNER/brigade:${GITHUB_REF_NAME#v}"
          docker pull "$IMAGE"
          container=$(docker create "$IMAGE")
          mkdir -p backend/bin
          docker cp "$container:/usr/local/bin/brigade" backend/bin/brigade
          docker rm "$container"
      - name: package
        run: |
          tar -czf "brigade-${{ github.ref_name }}-linux-amd64.tar.gz" -C backend/bin brigade
          cp "brigade-${{ github.ref_name }}-linux-amd64.tar.gz" brigade-linux-amd64.tar.gz
          npm pack ./plugins/ui --pack-destination .
          mv brigade-plugin-ui-*.tgz brigade-plugin-ui.tgz
      - name: release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$TAG^")
          {
            echo "## What's Changed"
            git log --reverse --format="- %s ([%h](https://github.com/$GITHUB_REPOSITORY/commit/%H))" "$previous_tag..$TAG"
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$TAG"
          } > release-notes.md
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            set -- --prerelease
          else
            set --
          fi
          gh release create "$TAG" \
            "brigade-$TAG-linux-amd64.tar.gz" \
            brigade-linux-amd64.tar.gz \
            desktop-artifact/*.dmg \
            plugin-artifacts/*.mcpb \
            brigade-plugin-ui.tgz \
            --notes-file release-notes.md \
            --verify-tag \
            "$@"
