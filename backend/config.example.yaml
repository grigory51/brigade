# Пример конфигурации brigade. Скопируйте в config.yaml и поправьте значения.
# Любое поле перекрывается переменной окружения с префиксом BRIGADE_ и разделителем
# уровней через двойное подчёркивание: например BRIGADE_JWT__SECRET, BRIGADE_ADDR.

# Режим спавна агентов инстанса: local — процесс на хосте в pty; docker — отдельный
# контейнер на сессию. Это свойство сервера, а не выбор пользователя: все сессии
# наследуют режим. docker требует доступного docker-демона. Дефолт — local.
mode: local

# Адрес HTTP-сервера (ConnectRPC + WebSocket + встроенный фронтенд).
addr: ":8080"

# Путь к файлу SQLite. Создаётся при первом запуске, миграции прогоняются автоматически.
sqlite_path: "brigade.db"

jwt:
  # Ключ подписи JWT. В проде задавайте через env (BRIGADE_JWT__SECRET), не храните в yaml.
  secret: "change-me-in-production"
  # TTL access-токена держим коротким; обновление — по refresh-токену.
  access_ttl: "15m"
  refresh_ttl: "720h"

# Способы входа. Пароль можно отключить после проверки OIDC — тогда экран входа
# показывает только кнопку провайдера.
auth:
  password_enabled: true
  oidc:
    # OIDC issuer; discovery читается из /.well-known/openid-configuration.
    issuer: ""
    client_id: ""
    # В проде задавайте через BRIGADE_AUTH__OIDC__CLIENT_SECRET.
    client_secret: ""
    redirect_url: "https://brigade.example.com/auth/oidc/callback"
    name: "ZITADEL"
    required_role: "brigade:user"
    # Дефолты ниже подходят ZITADEL; переопределите их для другого провайдера.
    role_claim: "urn:zitadel:iam:org:project:roles"
    username_claim: "name"
    # Пустой список включает openid/profile/email и scope требуемой ZITADEL-роли.
    scopes: []

# Сид-пользователь создаётся при первом запуске, если таблица users пуста.
# При auth.password_enabled=false seed можно оставить пустым.
seed:
  username: "admin"
  password: "admin"

# Корневая рабочая директория агентов. В docker-режиме её подпапки bind-mount'ятся
# в контейнеры сессий.
work_dir: "./workspace"

# Потолок на число одновременных docker-контейнеров: ACP — контейнер на сессию,
# docker-CLI — общий контейнер на пользователя. Создание сессии сверх лимита
# отклоняется (RESOURCE_EXHAUSTED). Не задано → 16; отрицательное — без лимита.
# Только docker-режим.
max_containers: 16

# Образ контейнера агента по умолчанию (docker-режим). Он же донор runtime-компонентов
# brigade для сессий на пользовательских образах. Не задано → brigade/agent:latest
# (собирается локально из packaging/docker/agent/Dockerfile); инсталляции, которые образ не
# собирают, указывают опубликованный: ghcr.io/grigory51/brigade-agent:latest.
agent_image: ""

# Потолок на суммарный вес образов агента, добавленных ОДНИМ пользователем (Настройки →
# Среда агента). Образы лежат на диске хоста, поэтому без предела список забил бы его.
# Считается прирост места: слои, общие с другими образами пользователя, учитываются один
# раз. Не задано → 1 ГиБ; отрицательное — без ограничения. Только docker-режим.
image_quota_bytes: 1073741824

# Кеш MCPB-плагинов, установленных оператором через `brigade plugin install`.
# Пусто → ~/.brigade/plugins. Env: BRIGADE_PLUGINS_DIR.
plugins_dir: ""

# Базовый каталог per-user home на хосте (только docker-режим). brigade создаёт
# подкаталог <agent_home_dir>/<userID> и bind-mount'ит его в /home/agent целиком во
# все контейнеры пользователя. Общими per-user становятся состояние агентов и рабочие файлы
# (~/workspace). Между разными пользователями home не пересекается. Пусто — фича
# выключена (эфемерный home / named volume по дереву сессий).
# Подписочный токен Claude больше НЕ глобальный: задаётся каждым пользователем в UI
# (Настройки → Claude).
agent_home_dir: ""

# Telegram-боты принадлежат пользователям; здесь задаётся только транспорт updates для
# всего инстанса. Desktop всегда использует poll. Для webhook укажите публичный HTTPS URL
# до Telegram-handler без идентификатора бота.
telegram:
  mode: poll
  webhook_url: "https://brigade.example.com/api/telegram"

# Публикация dev-серверов сессий через встроенный L7-прокси: запрос на
# {sessionId}-{port}.{domain} проксируется к порту сессии (local — 127.0.0.1,
# docker — IP контейнера).
preview:
  enabled: true
  # Режим адресации preview:
  #   subdomain — {sessionId}-{port}.{domain} (требует wildcard-DNS);
  #   cookie    — один хост cookie_host, выбор через cookie (для сред без wildcard,
  #               например netbird expose). Ссылка вида https://cookie_host/?id=<id>-<port>
  #               ставит cookie и редиректит; дальше весь хост проксируется к dev-серверу.
  mode: "subdomain"
  # Базовый домен preview-поддоменов (mode=subdomain). "localhost" — для разработки
  # (Chrome/Firefox резолвят *.localhost сами); в проде — домен с wildcard-DNS.
  domain: "localhost"
  # Хост cookie-режима целиком (mode=cookie), напр. "preview.brigade.example.com".
  cookie_host: ""
  # Схема публичных preview-URL. https предполагает TLS: встроенный (секция tls) или
  # внешний терминатор.
  scheme: "http"
  # Порт в публичных URL, если отличается от порта прослушивания (например, 443 при
  # внешнем TLS-терминаторе). 0 — порт из addr (или tls.addr при scheme=https).
  external_port: 0

# Встроенная TLS-терминация (UI, API и preview-поддомены). Пустой addr — выключено.
# Сертификат должен покрывать домен и wildcard preview-поддоменов
# (SAN: domain + *.domain); wildcard выдаётся только по DNS-01 (certbot).
tls:
  addr: ""
  cert_file: ""
  key_file: ""

# Личная память пользователя: атомарные markdown-заметки в git-репо. Источник истины —
# .md-файлы (frontmatter + тело), durability делегирована git-remote. Агент складывает
# фрагменты из сессии через скилл /brigade:memory; дашборд — вкладка «Заметки».
#
# Репозиторий и креды — ПЕР-ЮЗЕРНЫЕ: каждый пользователь задаёт свой git-remote и (для
# git@-remote) приватный SSH-ключ в UI (Настройки → Память). Значения хранятся в БД
# зашифрованными (ключ шифрования производен от jwt.secret), наружу ключ не отдаётся.
# Здесь — только базовый каталог рабочих копий (общий на инстанс).
memory:
  # База пер-юзерных рабочих копий: <dir>/<userID>/repo (+ материализованный ключ).
  # Env: BRIGADE_MEMORY__DIR. Пусто → дефолт <home>/.brigade/memory.
  # Замечание по GitLab: push в защищённую ветку доступен Project Access Token (роль
  # Maintainer, scope write_repository) или SSH deploy key с write; у deploy token scope
  # write_repository НЕТ — им только clone. Проще снять protection с дефолтной ветки.
  dir: ""
