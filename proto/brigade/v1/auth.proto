syntax = "proto3";

package brigade.v1;

// Пустой ответ для методов без полезной нагрузки (например, Logout).
message Empty {}

// Пользователь системы. Пароль не передаётся клиенту.
message User {
  string id = 1;
  string username = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

// access_token — короткоживущий JWT; refresh_token — для обновления без повторного логина.
// Для web access-токен также выставляется httpOnly-cookie, mobile использует Bearer.
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
}

// ClaudeSettings — состояние Claude-настроек пользователя. Само значение токена
// наружу НЕ отдаётся никогда: только флаг «задан ли токен».
message ClaudeSettings {
  bool token_set = 1;
}

// SetClaudeTokenRequest — установка/очистка подписочного токена Claude Code
// пользователя. Пустой token очищает настройку.
message SetClaudeTokenRequest {
  string token = 1;
}

message CodexSettings {
  bool api_key_set = 1;
  bool chatgpt_connected = 2;
  string default_profile = 3;
}

message SetCodexApiKeyRequest { string api_key = 1; }
message SetCodexDefaultProfileRequest { string profile = 1; }
message SetCodexChatGPTAuthRequest {
  // Содержимое официального CODEX_HOME/auth.json. Принимается только сервером и
  // сохраняется зашифрованным; обратно клиенту никогда не возвращается.
  string auth_json = 1;
}
message CodexLogin {
  string id = 1;
  string status = 2;
  string output = 3;
  string error = 4;
}
message GetCodexLoginRequest { string id = 1; }
message CancelCodexLoginRequest { string id = 1; }

// MemorySettings — состояние настроек личной памяти пользователя: remote (его собственный
// git-репозиторий заметок). Доступ к git@-remote идёт по SSH-ключу агента (см. SSHSettings),
// отдельный ключ памяти не задаётся.
message MemorySettings {
  string remote = 1;
}

// SetMemorySettingsRequest — установка git-remote личной памяти (пустой отключает память).
message SetMemorySettingsRequest {
  string remote = 1;
}

// NtfySettings — состояние настроек персональных push-уведомлений через ntfy. server и
// topic показываются в UI; значение токена наружу НЕ отдаётся — только флаг token_set.
// events — включённые пользователем события (напр. "turn_end", "error").
message NtfySettings {
  string server = 1;
  string topic = 2;
  bool token_set = 3;
  repeated string events = 4;
}

// SetNtfySettingsRequest — установка настроек ntfy. server/topic/events перезаписываются
// всегда (пустой topic отключает уведомления). token: пустой СОХРАНЯЕТ прежний (правка
// server/topic не стирает токен); задать новый — прислать непустой.
message SetNtfySettingsRequest {
  string server = 1;
  string topic = 2;
  string token = 3;
  repeated string events = 4;
}

// SSHSettings — публичная часть per-user SSH-ключа агента. Приватный ключ генерируется и
// хранится на сервере (зашифрован) и подкладывается в контейнер сессии; наружу отдаётся
// только публичный ключ — его пользователь добавляет в GitHub (SSH keys / deploy key),
// чтобы агент мог пушить.
message SSHSettings {
  string public_key = 1;
}

// DockerContext — контекст docker CLI на машине (docker context ls): имя и адрес демона.
message DockerContext {
  string name = 1;
  string host = 2;
  // current — контекст, выбранный в самом docker CLI (`docker context use`).
  bool current = 3;
}

// AgentRuntimeSettings — режим исполнения сессий и подключение к докеру.
//
// В серверной инсталляции режим задан конфигом: editable=false, клиент только показывает
// его. В десктопном приложении режим правится из интерфейса и применяется перезапуском
// приложения — до него mode отличается от running_mode, и restart_required=true.
message AgentRuntimeSettings {
  string mode = 1;
  string running_mode = 2;
  string docker_context = 3;
  string running_context = 4;
  bool editable = 5;
  bool restart_required = 6;
  repeated DockerContext contexts = 7;
  // docker_error — почему docker недоступен (пусто — доступен): демон не установлен, не
  // запущен либо выбранный контекст не отвечает. Если инстанс поднимался в docker-режиме и
  // не смог, running_mode будет local, а здесь — причина.
  string docker_error = 8;
}

// SetAgentRuntimeRequest — новый режим и (для docker) контекст. Доступен только там, где
// настройки редактируемы.
message SetAgentRuntimeRequest {
  string mode = 1;
  string docker_context = 2;
}

// AgentImage — образ контейнера агента в списке пользователя. size_bytes — вес образа за
// вычетом слоёв, общих с другими его образами (реальный прирост занятого места).
message AgentImage {
  string image = 1;
  int64 size_bytes = 2;
}

// AgentImagesSettings — образы контейнеров агента, доступные пользователю при создании
// сессии, и состояние квоты. default_image — базовый образ brigade (подставляется, когда
// пользователь не выбрал свой).
message AgentImagesSettings {
  repeated AgentImage images = 1;
  string default_image = 2;
  int64 used_bytes = 3;
  int64 quota_bytes = 4;
}

// SetAgentImagesRequest — новый список образов (перезаписывается целиком). Каждый образ
// проверяется: подтягивается при отсутствии, проверяется на пригодность для сессий и на
// квоту.
message SetAgentImagesRequest {
  repeated string images = 1;
}

// ServerInfo — режим работы сервера, от которого зависит интерфейс клиента.
// desktop=true у локального однопользовательского запуска (`brigade desktop`): там
// авто-логин сид-пользователя, поэтому ни входа, ни выхода, ни смены пользователя нет.
message ServerInfo {
  bool desktop = 1;
}

// AuthService — логин/пароль с JWT (TTL), refresh-токеном и per-user настройками Claude.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {}
  // Me возвращает текущего пользователя по access-токену (из cookie или Bearer).
  rpc Me(Empty) returns (User) {}
  // GetServerInfo сообщает клиенту режим работы сервера (см. ServerInfo).
  rpc GetServerInfo(Empty) returns (ServerInfo) {}
  rpc Logout(Empty) returns (Empty) {}
  // GetClaudeSettings возвращает состояние Claude-настроек пользователя (только флаг
  // token_set — значение токена не раскрывается).
  rpc GetClaudeSettings(Empty) returns (ClaudeSettings) {}
  // SetClaudeToken задаёт (или очищает пустым значением) подписочный токен Claude
  // пользователя. Возвращает обновлённое состояние (token_set).
  rpc SetClaudeToken(SetClaudeTokenRequest) returns (ClaudeSettings) {}
  rpc GetCodexSettings(Empty) returns (CodexSettings) {}
  rpc SetCodexApiKey(SetCodexApiKeyRequest) returns (CodexSettings) {}
  rpc SetCodexChatGPTAuth(SetCodexChatGPTAuthRequest) returns (CodexSettings) {}
  rpc StartCodexLogin(Empty) returns (CodexLogin) {}
  rpc GetCodexLogin(GetCodexLoginRequest) returns (CodexLogin) {}
  rpc CancelCodexLogin(CancelCodexLoginRequest) returns (Empty) {}
  rpc DisconnectCodexChatGPT(Empty) returns (CodexSettings) {}
  rpc SetCodexDefaultProfile(SetCodexDefaultProfileRequest) returns (CodexSettings) {}
  // GetMemorySettings возвращает настройки личной памяти пользователя (git-remote).
  rpc GetMemorySettings(Empty) returns (MemorySettings) {}
  // SetMemorySettings задаёт git-remote личной памяти. Возвращает обновлённое состояние.
  rpc SetMemorySettings(SetMemorySettingsRequest) returns (MemorySettings) {}
  // GetNtfySettings возвращает настройки push-уведомлений пользователя (server/topic/events
  // + флаг token_set; значение токена не раскрывается).
  rpc GetNtfySettings(Empty) returns (NtfySettings) {}
  // SetNtfySettings задаёт server/topic/token/events персональных ntfy-уведомлений.
  // Возвращает обновлённое состояние.
  rpc SetNtfySettings(SetNtfySettingsRequest) returns (NtfySettings) {}
  // GetAgentRuntime возвращает режим исполнения сессий (local|docker), доступные
  // docker-контексты и признак «нужен перезапуск».
  rpc GetAgentRuntime(Empty) returns (AgentRuntimeSettings) {}
  // SetAgentRuntime задаёт режим и docker-контекст (только десктопная инсталляция).
  rpc SetAgentRuntime(SetAgentRuntimeRequest) returns (AgentRuntimeSettings) {}
  // GetAgentImages возвращает образы контейнеров агента пользователя, базовый образ и
  // состояние квоты.
  rpc GetAgentImages(Empty) returns (AgentImagesSettings) {}
  // SetAgentImages перезаписывает список образов пользователя. Образ, который не удалось
  // подтянуть, не пригоден для сессий или не влезает в квоту, отклоняет весь запрос.
  rpc SetAgentImages(SetAgentImagesRequest) returns (AgentImagesSettings) {}
  // TestNtfy шлёт пробное уведомление по СОХРАНЁННЫМ настройкам пользователя: проверка
  // топика/сервера/токена из UI. Ошибка доставки возвращается вызывающему — иначе
  // неверные настройки обнаруживались бы только по молчанию в реальной сессии.
  rpc TestNtfy(Empty) returns (Empty) {}
  // GetSSHSettings возвращает публичный SSH-ключ агента пользователя, генерируя пару при
  // первом обращении (приватный ключ наружу не отдаётся).
  rpc GetSSHSettings(Empty) returns (SSHSettings) {}
  // RegenerateSSHKey перевыпускает пару SSH-ключей агента (старый публичный ключ в GitHub
  // после этого недействителен). Возвращает новый публичный ключ.
  rpc RegenerateSSHKey(Empty) returns (SSHSettings) {}
}
